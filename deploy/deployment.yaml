# 这个 Deployment 刻意遵守它自己检查的那些规则。
#
# 一个准入控制器如果自己跑在 privileged、挂 hostPath、以 root 运行的 Pod 里，
# 那它讲的"最小权限"就只是口号。评审时第一眼就会看这里。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-guard
  namespace: k8s-guard
  labels:
    app.kubernetes.io/name: k8s-guard
spec:
  replicas: 2
  # 两个副本配 PDB 才能扛住滚动更新——webhook 是 fail-closed 的，
  # 它短暂不可用等于集群短暂不能建 Pod。
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-guard
    spec:
      serviceAccountName: k8s-guard
      automountServiceAccountToken: false # 它不调 apiserver，不需要 token
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/yliucherish/k8s-admission-guard:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8443
            - -cert=/tls/tls.crt
            - -key=/tls/tls.key
            - -allowed-registries=docker.io/library,ghcr.io/yliucherish,registry.k8s.io
            - -exempt-namespaces=kube-system,k8s-guard
            - -log-level=info
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            # 请求小但限制不能太紧：webhook 被 OOMKill 会导致 Pod 创建全挂。
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        # 用 secret 而不是挂 hostPath —— 同样是为了自己守自己的规矩。
        - name: tls
          secret:
            secretName: k8s-guard-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-guard
  namespace: k8s-guard
  labels:
    app.kubernetes.io/name: k8s-guard
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k8s-guard
  namespace: k8s-guard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-guard
